### model
model_name_or_path: models/qwen3-1.7b
trust_remote_code: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

### data
dataset_dir: datasets/song-zhiyi/sft
dataset: song_zhiyi_train
eval_dataset: song_zhiyi_validation
template: qwen3_nothink
cutoff_len: 1024
train_on_prompt: false
mask_history: true
packing: false
overwrite_cache: true
preprocessing_num_workers: 1
dataloader_num_workers: 0

### output
output_dir: outputs/lora-song-zhiyi-v2
logging_steps: 5
save_strategy: steps
save_steps: 17
save_total_limit: 6
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
fp16: false
gradient_checkpointing: true
optim: adamw_torch
seed: 42

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 17
