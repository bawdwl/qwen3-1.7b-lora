### model
model_name_or_path: models/qwen3-1.7b
trust_remote_code: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 32
lora_dropout: 0.1
lora_target:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

### data
dataset_dir: data/prepared/huanhuan-author-close-v1
dataset: huanhuan_author_close
template: qwen3_nothink
cutoff_len: 384
train_on_prompt: false
mask_history: true
packing: false
overwrite_cache: true
preprocessing_num_workers: 1
dataloader_num_workers: 0

### output
output_dir: outputs/huanhuan-qwen3-lora-v1
logging_steps: 10
save_strategy: steps
save_steps: 117
save_total_limit: 6
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: linear
warmup_ratio: 0.0
weight_decay: 0.0
max_grad_norm: 1.0
bf16: true
fp16: false
gradient_checkpointing: true
optim: adamw_torch
seed: 42
