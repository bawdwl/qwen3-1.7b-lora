### model
model_name_or_path: models/qwen3-1.7b
model_revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
trust_remote_code: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 4
lora_alpha: 8
lora_dropout: 0.05
lora_target:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

### data
dataset_dir: datasets/pei-jiming/sft
dataset: pei_jiming_train
eval_dataset: pei_jiming_validation
template: qwen3_nothink
cutoff_len: 768
train_on_prompt: false
mask_history: true
packing: false
dataloader_num_workers: 0

### output
output_dir: outputs/lora-pei-jiming-v2-attn-reproduced
logging_steps: 5
save_fractions:
  - 0.5
  - 1.0
  - 1.5
  - 2.0

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.04
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
fp16: false
gradient_checkpointing: true
optim: adamw_torch
seed: 42
long_target_weight: 3.0
long_target_char_threshold: 60

### eval
per_device_eval_batch_size: 1
eval_steps: 5
